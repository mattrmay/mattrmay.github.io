<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Texas Hold'em has moved to tabletop.poker</title>
<link rel="canonical" href="https://tabletop.poker/">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0f0d; color: #f3ead7; font: 16px/1.5 system-ui, sans-serif; }
  main { text-align: center; padding: 24px; }
  h1 { font: 400 28px Georgia, serif; color: #e2c07d; margin: 0 0 12px; }
  a { color: #e2c07d; }
</style>
</head>
<body>
<main>
  <h1>&#9824; Texas Hold'em has moved &#9824;</h1>
  <p>It's now at <a id="go" href="https://tabletop.poker/">tabletop.poker</a>. Taking you there...</p>
</main>
<script>
  // Forward to the new address, keeping an invite's ?table=CODE. Your name, settings and stats are saved per
  // address, so they ride along once in the link's #fragment (never sent to any server); the new site keeps
  // them only if it has nothing saved yet. Hand history comes too when it fits in a link.
  (function () {
    var TARGET = "https://tabletop.poker/";
    var keys = ["holdem.options.v1", "holdem.stats.v2", "holdem.drills.v1", "holdem.table.v1", "holdem.online.stats.v1", "holdem.history.v2", "holdem.online.history.v1"];
    var pack = {};
    try { keys.forEach(function (k) { var v = localStorage.getItem(k); if (v) pack[k] = v; }); } catch (e) {}
    function link(p) {
      if (!Object.keys(p).length) return "";
      return "#import=" + btoa(unescape(encodeURIComponent(JSON.stringify(p)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }
    var hash = link(pack);
    if (hash.length > 60000) { delete pack["holdem.history.v2"]; delete pack["holdem.online.history.v1"]; hash = link(pack); }
    if (hash.length > 60000) hash = "";
    var url = TARGET + location.search + hash;
    document.getElementById("go").href = url;
    location.replace(url);
  })();
</script>
</body>
</html>
