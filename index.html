<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mattrmay.github.io</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0f0d; color: #f3ead7; font: 16px/1.5 system-ui, sans-serif; }
  main { text-align: center; padding: 24px; }
  h1 { font: 400 28px Georgia, serif; color: #e2c07d; margin: 0 0 18px; }
  a { display: inline-block; padding: 12px 22px; border-radius: 10px; background: #e2c07d; color: #14110a; font-weight: 600; text-decoration: none; }
  a:focus-visible { outline: 3px solid #f3ead7; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>&#9824; Texas Hold'em &#9824;</h1>
  <a id="play" href="/poker/">Play poker</a>
</main>
<script>
  // An old invite link (?table=CODE) keeps its table code when you click through
  if (location.search) document.getElementById("play").href = "/poker/" + location.search;
</script>
</body>
</html>
