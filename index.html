  html { scrollbar-gutter: stable; } /* a scrollbar appearing must not narrow the table */
* { scrollbar-width: thin; scrollbar-color: rgba(226,192,125,0.32) transparent; }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: rgba(226,192,125,0.28); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
  *::-webkit-scrollbar-thumb:hover { background: rgba(226,192,125,0.5); border: 2px solid transparent; background-clip: padding-box; }
  *::-webkit-scrollbar-corner { background: transparent; }
  .btn { -webkit-tap-highlight-color: transparent; }
  .num { font-variant-numeric: tabular-nums; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid ${_}; outline-offset: 2px; }
  @media (hover: hover) {
    .btn:not(:disabled):hover { filter: brightness(1.12); transform: translateY(-1px); }
    .row-btn:hover { background: rgba(255,255,255,0.06) !important; }
  }
  .btn:not(:disabled):active { transform: translateY(1px); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; transition-delay: 0ms !important; }
  }
  @keyframes badgeIn {
    0% { transform: translateY(-50%) scale(0.7); opacity: 0; }
    60% { transform: translateY(-50%) scale(1.08); opacity: 1; }
    100% { transform: translateY(-50%) scale(1); opacity: 1; }
  }
  @keyframes talkIn {
    0% { transform: translateY(-6px) scale(0.9); opacity: 0; }
    100% { transform: none; opacity: 1; }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes chipFly {
    0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
    12% { opacity: 1; }
    80% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1); opacity: 0; }
  }
  .more-options[open] .chev { transform: rotate(90deg); }
  .more-options summary::-webkit-details-marker { display: none; }
  @keyframes toMuck {
    0% { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(25deg) scale(0.6); opacity: 0; }
